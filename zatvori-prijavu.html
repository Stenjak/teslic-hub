<!doctype html>
<html lang="bs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex">
  <title>Zatvori prijavu – Teslić Hub</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font: 1rem/1.5 system-ui, sans-serif; color: #102441; background: #eef6fc; }
    header { background: #092d59; color: white; padding: 18px max(20px, calc((100% - 600px) / 2)); font-size: 1.35rem; font-weight: 700; }
    main { width: min(600px, calc(100% - 32px)); margin: 32px auto; padding: 24px; background: white; border: 1px solid #bfd0df; border-radius: 14px; }
    h1 { margin: 0 0 12px; font-size: 1.45rem; }
    button { font: inherit; font-weight: 700; padding: 10px 16px; background: #0769b6; color: white; border: 0; border-radius: 8px; cursor: pointer; }
    button:disabled { opacity: .6; cursor: wait; }
    a { color: #07548d; }
  </style>
</head>
<body>
  <header>Teslić Hub</header>
  <main>
    <h1>Izgubljeno – Nađeno</h1>
    <p id="status" role="status"></p>
    <button id="confirm" type="button" hidden>Potvrdi da je predmet vraćen</button>
    <p><a href="./">Nazad na Teslić Hub</a></p>
  </main>
  <script>
    const feedback = document.getElementById('status');
    const button = document.getElementById('confirm');
    const token = location.hash.slice(1);
    const endpoint = 'https://mdwzlyfzioxlavkthzul.supabase.co/functions/v1/teslic-hub-dostava';

    if (/^[a-f0-9]{64}$/.test(token)) {
      feedback.textContent = 'Potvrdom ćeš zatvoriti prijavu i skloniti je s javne liste.';
      button.hidden = false;
    } else {
      feedback.textContent = 'Link nije važeći. Otvori cijeli link iz e-maila.';
    }

    button.addEventListener('click', async () => {
      button.disabled = true;
      feedback.textContent = 'Zatvaram prijavu…';
      try {
        const response = await fetch(endpoint, {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({radnja: 'zatvori', token}),
          signal: AbortSignal.timeout(15000),
        });
        if (response.ok || response.status === 404) {
          feedback.textContent = response.ok
            ? 'Prijava je zatvorena i označena kao vraćena vlasniku.'
            : 'Link nije važeći ili prijava više nije aktivna.';
          button.hidden = true;
          history.replaceState(null, '', location.pathname);
        } else {
          feedback.textContent = 'Zatvaranje trenutno nije dostupno. Pokušaj ponovo.';
        }
      } catch {
        feedback.textContent = 'Potvrda nije stigla. Provjeri vezu i pokušaj ponovo.';
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
